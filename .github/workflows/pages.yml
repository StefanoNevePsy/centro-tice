name: Deploy su GitHub Pages

# Sostituisce il deploy automatico "da branch" di GitHub, che non e' avviabile
# a mano ne' configurabile. Perche' faccia effetto, in Settings > Pages la
# sorgente va messa su "GitHub Actions" (una volta sola).

on:
  # Avvio manuale: dalla tab Actions, con la possibilita' di scegliere il branch
  # da pubblicare. Nota: "Use workflow from" sceglie da dove viene letto QUESTO
  # file; il campo "branch" qui sotto sceglie il codice che finisce online, e
  # puo' essere un branch diverso.
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch da pubblicare (vuoto = quello da cui lanci il workflow)'
        required: false
        type: string
  # Deploy automatico a ogni push sul branch del Centro TICE (e su main, come prima)
  push:
    branches:
      - main
      - claude/quaderno-tice

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; le richieste in coda vengono sostituite dall'ultima.
# Non annulla un deploy gia' in corso, per non lasciare Pages a meta'.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.secondo.outputs.page_url || steps.primo.outputs.page_url }}
    steps:
      - name: Checkout del branch scelto
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Cosa sto pubblicando
        run: |
          echo "Branch richiesto : ${{ inputs.branch || github.ref_name }}"
          echo "Commit           : $(git rev-parse --short HEAD)"
          echo "Messaggio        : $(git log -1 --pretty=%s)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Se un test fallisce la pubblicazione si ferma qui: online resta la versione di prima
      - name: Test (sicurezza del custode, calcoli clinici, sintassi)
        run: sh tools/test-tutti.sh

      - name: Build del sito in www/
        run: node build.js
        env:
          TICE_CSP: '1'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      # GitHub a volte non trova subito il pacchetto appena caricato («No artifacts named github-pages»):
      # si riprova dopo qualche secondo invece di segnare la pubblicazione come fallita
      - id: primo
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Attesa prima di riprovare
        if: steps.primo.outcome == 'failure'
        run: sleep 30

      - id: secondo
        if: steps.primo.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Attesa prima dell'ultimo tentativo
        if: steps.primo.outcome == 'failure' && steps.secondo.outcome == 'failure'
        run: sleep 60

      - id: deployment
        if: steps.primo.outcome == 'failure' && steps.secondo.outcome == 'failure'
        uses: actions/deploy-pages@v4
