name: Test Quaderno TICE

# Le regole di sicurezza del custode e i calcoli clinici vengono verificati a
# ogni modifica: una regola rotta deve fermarsi qui, non arrivare al centro.
on:
  push:
    branches: [claude/quaderno-tice]
    paths: ['custode/**', 'electron/**', 'js/tice-*.js', 'js/orario.js', 'js/numbers-reader.js', 'strumenti/**', 'sw.js', 'build.js', 'tools/test-*.js', 'tools/custode-mock.js']
  pull_request:
    paths: ['custode/**', 'electron/**', 'js/tice-*.js', 'js/orario.js', 'js/numbers-reader.js', 'strumenti/**', 'sw.js', 'build.js', 'tools/test-*.js', 'tools/custode-mock.js']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tutti i test
        run: sh tools/test-tutti.sh
      - name: Pubblicazione con service worker
        run: node build.js && grep -q '"./index.html"' www/sw.js
